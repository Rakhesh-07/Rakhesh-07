<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 32" role="img" aria-labelledby="title desc">
  <title id="title">Loading animation</title>
  <desc id="desc">Three blue dots that pulse in sequence.</desc>
  <g fill="#2f81f7">
    <circle cx="42" cy="16" r="5"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="66" cy="16" r="5"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" begin=".2s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="16" r="5"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" begin=".4s" repeatCount="indefinite"/></circle>
  </g>
</svg>
