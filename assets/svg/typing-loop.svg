<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 64" role="img" aria-labelledby="title desc">
  <title id="title">Typing animation</title>
  <desc id="desc">The phrase Building reliable AI systems appears with a restrained typing cursor.</desc>
  <defs>
    <clipPath id="reveal"><rect width="0" height="48" x="0" y="8"><animate attributeName="width" values="0;520;520;0;0" keyTimes="0;.42;.7;.92;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <text x="0" y="42" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="28" font-weight="600" clip-path="url(#reveal)">Building reliable AI systems</text>
  <rect x="0" y="17" width="3" height="29" fill="#2f81f7">
    <animate attributeName="x" values="0;0;520;520;0;0" keyTimes="0;.03;.42;.7;.92;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/>
  </rect>
</svg>
