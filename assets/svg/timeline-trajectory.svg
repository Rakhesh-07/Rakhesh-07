<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Engineering trajectory</title>
  <desc id="desc">A three-stage timeline from data and analytics through AI systems to secure intelligent software.</desc>
  <defs>
    <linearGradient id="progress" x1="0" x2="1">
      <stop offset="0" stop-color="#2f81f7" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="238" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text x="56" y="58" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.8">ENGINEERING TRAJECTORY</text>
  <path d="M128 128H1072" fill="none" stroke="#30363d" stroke-width="2"/>
  <path d="M128 128H1072" fill="none" stroke="url(#progress)" stroke-width="2" stroke-dasharray="944" stroke-dashoffset="944">
    <animate attributeName="stroke-dashoffset" from="944" to="0" dur="2.4s" fill="freeze"/>
  </path>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <g transform="translate(128 128)">
      <circle r="12" fill="#0d1117" stroke="#2f81f7" stroke-width="3"/>
      <circle r="4" fill="#2f81f7"/>
      <text x="0" y="44" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="700">Data and BI</text>
      <text x="0" y="68" text-anchor="middle" fill="#8b949e" font-size="14">Insight to action</text>
    </g>
    <g transform="translate(600 128)">
      <circle r="12" fill="#0d1117" stroke="#2f81f7" stroke-width="3"/>
      <circle r="4" fill="#2f81f7"/>
      <text x="0" y="44" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="700">AI Systems</text>
      <text x="0" y="68" text-anchor="middle" fill="#8b949e" font-size="14">Models in production</text>
    </g>
    <g transform="translate(1072 128)">
      <circle r="12" fill="#0d1117" stroke="#2ea043" stroke-width="3"/>
      <circle r="4" fill="#2ea043"/>
      <text x="0" y="44" text-anchor="middle" fill="#f0f6fc" font-size="17" font-weight="700">Trust and Scale</text>
      <text x="0" y="68" text-anchor="middle" fill="#8b949e" font-size="14">Reliable software</text>
    </g>
  </g>
</svg>
