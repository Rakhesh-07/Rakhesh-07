<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Rakhesh Varshan Dhamodaran — AI Engineer</title>
  <desc id="desc">A restrained dark banner with a subtle animated systems diagram and the text AI Engineer building secure, data-driven intelligent systems.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111c2d"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" x2="1">
      <stop offset="0%" stop-color="#2f81f7" stop-opacity="0"/>
      <stop offset="45%" stop-color="#2f81f7" stop-opacity=".82"/>
      <stop offset="100%" stop-color="#2f81f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#surface)"/>
  <rect x="24" y="24" width="1232" height="312" rx="16" fill="none" stroke="#30363d"/>
  <g fill="none" stroke="#2f81f7" stroke-linecap="round">
    <path d="M64 274 C180 218 272 294 392 228 S622 180 740 228 S1004 300 1216 112" opacity=".18" stroke-width="1"/>
    <path d="M64 274 C180 218 272 294 392 228 S622 180 740 228 S1004 300 1216 112" opacity=".75" stroke="url(#signal)" stroke-width="2" stroke-dasharray="64 720">
      <animate attributeName="stroke-dashoffset" from="784" to="-784" dur="18s" repeatCount="indefinite"/>
    </path>
    <path d="M84 90 H298 L362 150 H572" opacity=".16" stroke-width="1"/>
    <path d="M798 92 H1004 L1076 154 H1200" opacity=".16" stroke-width="1"/>
  </g>
  <g fill="#2f81f7">
    <circle cx="64" cy="274" r="4" opacity=".78"><animate attributeName="opacity" values=".25;.95;.25" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="392" cy="228" r="4" opacity=".62"><animate attributeName="opacity" values=".2;.9;.2" dur="5s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="228" r="4" opacity=".62"><animate attributeName="opacity" values=".2;.9;.2" dur="5s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1216" cy="112" r="4" opacity=".78"><animate attributeName="opacity" values=".25;.95;.25" dur="5s" begin="3.6s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="88" y="128" fill="#8b949e" font-size="15" font-weight="700" letter-spacing="4">ENGINEERING INTELLIGENT SYSTEMS</text>
    <text x="88" y="190" fill="#f0f6fc" font-size="42" font-weight="700" letter-spacing="-1">Rakhesh Varshan Dhamodaran</text>
    <text x="88" y="230" fill="#c9d1d9" font-size="23" font-weight="500">AI Engineer · Machine Learning · Data &amp; Business Intelligence</text>
    <text x="88" y="282" fill="#8b949e" font-size="17">Building secure, data-driven software from model inference to decision support.</text>
  </g>
  <g transform="translate(1070 252)">
    <rect width="122" height="36" rx="18" fill="#161b22" stroke="#30363d"/>
    <circle cx="22" cy="18" r="5" fill="#2ea043"/>
    <text x="38" y="23" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600">OPEN TO WORK</text>
  </g>
</svg>
